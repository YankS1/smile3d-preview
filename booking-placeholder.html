<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Онлайн-запись · Smile 3D</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'Geist', system-ui, -apple-system, sans-serif;
      background:
        radial-gradient(circle at 20% 0%, rgba(33,182,199,0.10) 0%, transparent 55%),
        radial-gradient(circle at 80% 100%, rgba(14,140,157,0.07) 0%, transparent 55%),
        #f7fbfc;
      color: #0e1b26;
      min-height: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 32px 24px;
      text-align: center;
      animation: page-in 600ms cubic-bezier(.16,1,.3,1) both;
    }
    @keyframes page-in {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: none; }
    }
    .wordmark {
      font-size: 44px; font-weight: 600;
      letter-spacing: 10px;
      padding-left: 10px;
      text-transform: uppercase;
      margin-bottom: 28px;
      line-height: 1;
    }
    .wordmark span { color: #21B6C7; }

    .badge {
      display: inline-flex; align-items: center; gap: 9px;
      padding: 8px 16px 8px 14px;
      border-radius: 100px;
      background: rgba(33,182,199,0.10);
      color: #0e8c9d;
      font-family: 'Geist Mono', ui-monospace, monospace;
      font-size: 11.5px; font-weight: 500;
      letter-spacing: 1.5px; text-transform: uppercase;
      margin-bottom: 24px;
    }
    .badge__dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #21B6C7;
      box-shadow: 0 0 0 0 rgba(33,182,199,0.55);
      animation: dot-pulse 2.2s cubic-bezier(.4,0,.2,1) infinite;
    }
    @keyframes dot-pulse {
      0%   { box-shadow: 0 0 0 0   rgba(33,182,199,0.55); }
      70%  { box-shadow: 0 0 0 10px rgba(33,182,199,0); }
      100% { box-shadow: 0 0 0 0   rgba(33,182,199,0); }
    }

    h1 {
      font-size: 28px; font-weight: 600;
      letter-spacing: -0.4px;
      max-width: 520px;
      line-height: 1.3;
      margin-bottom: 14px;
      text-wrap: balance;
    }

    p {
      color: #5e6f7c;
      font-size: 15px;
      max-width: 420px;
      line-height: 1.55;
    }

    .phone {
      margin-top: 32px;
      display: inline-flex; align-items: center; gap: 10px;
      padding: 14px 22px;
      background: #ffffff;
      border: 1px solid rgba(33,182,199,0.30);
      border-radius: 100px;
      color: #0e1b26;
      font-size: 17px; font-weight: 600;
      letter-spacing: -0.2px;
      text-decoration: none;
      box-shadow: 0 6px 22px -10px rgba(14,27,38,0.12);
      transition: all 280ms cubic-bezier(.16,1,.3,1);
    }
    .phone:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 32px -12px rgba(14,27,38,0.18);
      border-color: #21B6C7;
    }
    .phone__icon {
      width: 16px; height: 16px;
      color: #21B6C7;
    }

    .back {
      margin-top: 24px;
      font-size: 13px;
      color: #5e6f7c;
      text-decoration: none;
      font-weight: 500;
      letter-spacing: 0.2px;
      transition: color 200ms ease;
    }
    .back:hover { color: #0e8c9d; }

    @media (max-width: 540px) {
      .wordmark { font-size: 32px; letter-spacing: 7px; padding-left: 7px; }
      h1 { font-size: 22px; }
      .badge { font-size: 10.5px; }
    }
  </style>
</head>
<body>
  <div class="wordmark">Smile<span>3D</span></div>

  <div class="badge">
    <span class="badge__dot" aria-hidden="true"></span>
    <span>YCLIENTS · скоро</span>
  </div>

  <h1>Здесь будет онлайн-запись через YCLIENTS</h1>
  <p>Виджет подключим как только клиент завершит интеграцию. Пока запись - по телефону, перезвоним в течение 15 минут.</p>

  <a class="phone" href="tel:+79934731010">
    <svg class="phone__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.86 19.86 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.86 19.86 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
    </svg>
    <span>8 (993) 473-10-10</span>
  </a>

  <a class="back" href="javascript:window.close();">Закрыть вкладку</a>
</body>
</html>
